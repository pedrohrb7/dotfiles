# Teclado: layouts us e br. Mantido à mão (o Void não tem systemd-localed).
# setup/hardware.sh instala como /etc/X11/xorg.conf.d/00-keyboard.conf.
# Ctrl+Alt+Space troca o grupo (awesome/config/keyboard.lua). Com os dois
# layouts como padrão do servidor, um teclado USB/Bluetooth conectado depois
# continua com os dois.
Section "InputClass"
	Identifier "system-keyboard"
	MatchIsKeyboard "on"
	Option "XkbLayout" "us,br"
	Option "XkbModel" "pc105+inet"
	Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
