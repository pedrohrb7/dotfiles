# Driver proprietário para a placa NVIDIA, em PRIME offload: sem
# "PrimaryGPU", a GPU integrada continua desenhando a tela e a NVIDIA aparece
# como provider NVIDIA-G0 (xrandr --listproviders), usada só por quem pedir
# (__NV_PRIME_RENDER_OFFLOAD=1). setup/hardware.sh instala em
# /etc/X11/xorg.conf.d/.
Section "OutputClass"
    Identifier "nvidia"
    MatchDriver "nvidia-drm"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration"
EndSection
