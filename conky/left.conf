-- Conky, coluna da esquerda (abaixo da wibar): sistema, rede, Bluetooth e
-- processos. A outra coluna é right.conf; o que as duas compartilham (janela,
-- fonte, paleta, templates) fica em common.lua.

conky.config = dofile(os.getenv("HOME") .. "/.config/conky/common.lua").config({
	own_window_title = "conky-left",
	alignment = "top_left",

	-- Lua: system.lua gera a seção de rede, bluetooth.lua a seção Bluetooth,
	-- click.lua trata os cliques (clicar na seção Bluetooth abre o
	-- blueman-manager)
	lua_load = "~/.config/conky/system.lua ~/.config/conky/bluetooth.lua ~/.config/conky/click.lua",
	lua_mouse_hook = "on_mouse",
})

conky.text = [[
${template0 󰌢 SISTEMA}
${template1 Host ${nodename}}
${template1 Kernel ${kernel}}
${template1 Uptime ${uptime_short}}

${template0 󰖩 REDE}
${lua_parse network}
${template0 󰂯 BLUETOOTH}
${lua_parse bluetooth}

${template0 󰉹 PROCESSOS}
${color2}CPU${goto 160}%CPU${alignr}%MEM
${template2 1}
${template2 2}
${template2 3}
${color2}MEMÓRIA${goto 160}RES${alignr}%MEM
${template3 1}
${template3 2}
${template3 3}]]
