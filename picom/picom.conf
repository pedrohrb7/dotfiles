# Fade windows in/out when opening/closing and when opacity changes,
#  unless no-fading-openclose is used.
# fading = false
fading = true

# Opacity change between steps while fading in. (0.01 - 1.0, defaults to 0.028)
# fade-in-step = 0.028
fade-in-step = 0.9;

# Opacity change between steps while fading out. (0.01 - 1.0, defaults to 0.03)
# fade-out-step = 0.03
fade-out-step = 0.9;


# Opacity of inactive windows. (0.1 - 1.0, defaults to 1.0)
# inactive-opacity = 1
inactive-opacity = 1;


# Let inactive opacity set by -i override the '_NET_WM_OPACITY' values of windows.
# inactive-opacity-override = true
inactive-opacity-override = false;

# Blur background of semi-transparent / ARGB windows. 
# Bad in performance, with driver-dependent behavior. 
# The name of the switch may change without prior notifications.
#
blur-background = true

# glx works on both GPUs (Mesa iris on Intel, the proprietary driver on NVIDIA).
# glx-copy-from-front, glx-swap-method, glx-use-copysubbuffer-mesa and
# xrender-sync no longer exist (picom v13 ignores them silently): buffer age is
# detected automatically and xrender-sync-fence replaces xrender-sync.
backend = "glx";
# Enable/disable VSync.
vsync = true;
xrender-sync-fence = true;
