; Polybar config for awesome WM.
; Palette mirrors config/styles/color.lua from the awesome dotfiles so the
; bar matches the WM's default (tokyonight-ish) look.

[colors]
background = #1a1b26
background-alt = #24283b
foreground = #a9b1d6
foreground-alt = #ffffff
primary = #BB9AF7
secondary = #7dcfff
red = #F7768E
green = #73daca
yellow = #E0AF68
blue = #7AA2F7
border = #2f404d

[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0

padding-left = 1
padding-right = 1
module-margin = 1

separator = "  "
separator-foreground = ${colors.border}

font-0 = "FiraCode Nerd Font:size=10;2"

modules-left = layout kblayout xworkspaces
modules-center = date
modules-right = mic volume xbacklight battery cpu tray

cursor-click = pointer
enable-ipc = true

[module/layout]
type = custom/script
exec = "$HOME/.config/polybar/scripts/layout.sh"
interval = 1
format-foreground = ${colors.foreground}

[module/kblayout]
type = custom/script
exec = "$HOME/.config/polybar/scripts/kblayout.sh"
interval = 1
format-foreground = ${colors.foreground}

[module/xworkspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = true
pin-workspaces = true
label-active = %name%
label-active-foreground = ${colors.background}
label-active-background = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.border}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/date]
; internal/date does not register a clickable area in this polybar build
; (upstream bug: https://github.com/polybar/polybar/issues/427), so this
; is custom/script instead, which supports click-left like module/mic below.
type = custom/script
exec = date "+%H:%M:%S %p  %A, %d %b, %Y"
interval = 1
format = <label>
label-foreground = ${colors.foreground}
click-left = "$HOME/.config/polybar/scripts/calendar.sh"

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
format-muted = <label-muted>
label-volume = VOL [%percentage%%]
label-volume-foreground = ${colors.foreground}
label-muted = VOL [muted]
label-muted-foreground = ${colors.red}
click-right = exec pavucontrol

[module/mic]
type = custom/script
exec = sh -c 'pamixer --default-source --get-mute 2>/dev/null | grep -q true && echo "MIC [muted]" || echo "MIC [$(pamixer --default-source --get-volume-human)]"'
interval = 1
click-left = pamixer --default-source -t
format-foreground = ${colors.foreground}

[module/xbacklight]
type = internal/backlight
card = intel_backlight
format = <label>
label = BR [%percentage%%]
label-foreground = ${colors.foreground}
enable-scroll = true

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = BAT %percentage%% (charging)
label-discharging = BAT [%percentage%%]
label-full = BAT [full]
label-discharging-foreground = ${colors.foreground}
label-charging-foreground = ${colors.green}
label-full-foreground = ${colors.green}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU [%percentage%%]
label-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
tray-spacing = 6
tray-background = ${colors.background}

[settings]
screenchange-reload = true
pseudo-transparency = true
