# Copied to .github/dependabot.yml. Keeps the SHA-pinned actions and every service's dependencies current.
# new-project adds one block per service (and a docker block per containerized service) from the examples below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # --- per service: copy, set the ecosystem and directory, delete the examples that don't apply ---
