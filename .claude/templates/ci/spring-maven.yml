# Spring Boot service built with Maven. Copied to .github/workflows/__SERVICE__.yml with __SERVICE__
# replaced by the folder name under services/. `verify` compiles, runs tests and every static-analysis
# plugin bound in pom.xml (Checkstyle/Spotless/SpotBugs) - bind lint there, not here.
name: __SERVICE__

on:
  push:
    branches: [main]
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  pull_request:
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/__SERVICE__

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: services/__SERVICE__/.java-version
          cache: maven
          cache-dependency-path: services/__SERVICE__/pom.xml
      # Testcontainers works out of the box on ubuntu-latest (Docker is preinstalled).
      - run: ./mvnw -B -ntp verify

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: services/__SERVICE__/.java-version
          cache: maven
          cache-dependency-path: services/__SERVICE__/pom.xml
      - run: ./mvnw -B -ntp package -DskipTests

  # ci=full only. Remove this job for ci=check.
  image:
    needs: [quality, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      service: __SERVICE__
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
