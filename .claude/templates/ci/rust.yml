# Rust service. Copied to .github/workflows/__SERVICE__.yml with __SERVICE__ replaced by the folder name
# under services/. The toolchain comes from the runner's preinstalled rustup (no third-party action);
# a rust-toolchain.toml in the service, if present, takes precedence.
name: __SERVICE__

on:
  push:
    branches: [main]
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  pull_request:
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/__SERVICE__

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # infra:postgres - uncomment when integration tests need a database.
    # services:
    #   postgres:
    #     image: postgres:18-alpine
    #     env:
    #       POSTGRES_USER: app
    #       POSTGRES_PASSWORD: app
    #       POSTGRES_DB: app_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/__SERVICE__
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/__SERVICE__
      - run: cargo build --release --locked

  # ci=full only. Remove this job for ci=check.
  image:
    needs: [quality, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      service: __SERVICE__
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
