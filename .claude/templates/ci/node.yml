# Node service (NestJS / Express API or React frontend). Copied to .github/workflows/__SERVICE__.yml
# with __SERVICE__ replaced by the folder name under services/. See README.md in this folder for variants.
name: __SERVICE__

on:
  push:
    branches: [main]
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  pull_request:
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/__SERVICE__

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # infra:postgres - backend only: uncomment when integration tests need a database.
    # services:
    #   postgres:
    #     image: postgres:18-alpine
    #     env:
    #       POSTGRES_USER: app
    #       POSTGRES_PASSWORD: app
    #       POSTGRES_DB: app_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   DATABASE_URL: postgresql://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/__SERVICE__/.nvmrc
          cache: npm
          cache-dependency-path: services/__SERVICE__/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/__SERVICE__/.nvmrc
          cache: npm
          cache-dependency-path: services/__SERVICE__/package-lock.json
      - run: npm ci
      - run: npm run build

  # ci=full only. Remove this job for ci=check.
  image:
    needs: [quality, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      service: __SERVICE__
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
