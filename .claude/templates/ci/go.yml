# Go service. Copied to .github/workflows/__SERVICE__.yml with __SERVICE__ replaced by the folder name
# under services/. Keep the Makefile's lint/test/build targets running the same commands as this file.
name: __SERVICE__

on:
  push:
    branches: [main]
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  pull_request:
    paths:
      - services/__SERVICE__/**
      - .github/workflows/__SERVICE__.yml
      - .github/workflows/_docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/__SERVICE__

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # infra:postgres - uncomment when integration tests need a database.
    # services:
    #   postgres:
    #     image: postgres:18-alpine
    #     env:
    #       POSTGRES_USER: app
    #       POSTGRES_PASSWORD: app
    #       POSTGRES_DB: app_test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/__SERVICE__/go.mod
          cache-dependency-path: services/__SERVICE__/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0
          working-directory: services/__SERVICE__
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/__SERVICE__/go.mod
          cache-dependency-path: services/__SERVICE__/go.sum
      - run: go build ./...

  # ci=full only. Remove this job for ci=check.
  image:
    needs: [quality, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      service: __SERVICE__
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
