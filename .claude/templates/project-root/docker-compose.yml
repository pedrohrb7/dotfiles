# Local development only - production images are built by CI from each service's final Dockerfile stage.
# new-project keeps the blocks for the services and infra chosen and deletes the rest.
# Run from the repo root: `cp .env.example .env && docker compose up --build`.
name: __PROJECT__

services:
  backend:
    build:
      context: ./services/backend
      target: dev                      # Dockerfile stage with dev dependencies and hot reload
    env_file: .env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./services/backend:/app        # source bind mount for hot reload
      - /app/node_modules              # keep the container's dependencies (Node only; drop for other stacks)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      target: dev
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # --- infra: keep only what the project uses ---

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_USER: ${MYSQL_USER:-app}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  # mysql-data:
